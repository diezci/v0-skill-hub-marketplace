<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080c10" />
    <title>Diime</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#080c10;color:#f7faf9}
      *{box-sizing:border-box}
      body{margin:0;background:#080c10}
      main{min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(circle at 50% 45%,rgba(49,219,144,.12),transparent 34%)}
      .brand{display:flex;flex-direction:column;align-items:center;transform:translateY(-2vh)}
      .mark{width:92px;height:92px;display:block;filter:drop-shadow(0 18px 28px rgba(0,0,0,.34))}
      strong{margin-top:20px;font-size:28px;letter-spacing:-.03em}
      p{margin:8px 0 0;color:#91a29b;font-size:14px;letter-spacing:.02em}
      .pulse{margin-top:28px;width:34px;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,#31db90,transparent);animation:pulse 1.3s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.3;transform:scaleX(.7)}50%{opacity:1;transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.7}}
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img class="mark" src="diime-mark-v3.svg" alt="" />
        <strong>Diime</strong>
        <p>Conectando talento y proyectos</p>
        <div class="pulse" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
