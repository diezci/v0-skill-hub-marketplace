<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080c10" />
    <title>Sin conexión · Diime</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080c10;color:#fafafa}
      *{box-sizing:border-box}body{margin:0}.page{min-height:100vh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));text-align:center}
      .card{max-width:390px;padding:32px 26px;border:1px solid #26312d;border-radius:24px;background:#101613;box-shadow:0 24px 70px #0008}.mark{display:block;width:72px;height:72px;margin:0 auto 20px;filter:drop-shadow(0 14px 22px #0007)}
      h1{margin:0 0 10px;font-size:25px}p{margin:0 0 24px;color:#a3a3a3;line-height:1.55}button{width:100%;border:0;border-radius:13px;padding:14px 18px;background:#16d968;color:#041108;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <!-- El error se sirve en una URL especial de Capacitor: incrustar la
             marca evita que su ruta relativa intente volver a salir a la red. -->
        <svg class="mark" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs><linearGradient id="diime-gradient" x1="96" y1="96" x2="928" y2="928" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#43D943"/><stop offset="1" stop-color="#058B99"/></linearGradient></defs>
          <rect x="64" y="64" width="896" height="896" rx="205" fill="url(#diime-gradient)"/>
          <path fill="#fff" fill-rule="evenodd" d="M576 231H666V801H576V754C547 784 510 802 464 802C368 802 300 728 300 626C300 524 368 450 464 450C510 450 547 468 576 498V231ZM485 536C432 536 395 573 395 626C395 679 432 716 485 716C538 716 576 679 576 626C576 573 538 536 485 536Z"/>
        </svg>
        <h1>Estás sin conexión</h1>
        <p>Comprueba tu conexión a internet para volver a cargar tus demandas, mensajes y trabajos.</p>
        <button type="button" onclick="location.replace('https://www.diime.es/')">Volver a intentarlo</button>
      </section>
    </main>
  </body>
</html>
