<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sin conexión · Diime</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0a0a0a;color:#fafafa}
      *{box-sizing:border-box}body{margin:0}.page{min-height:100vh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));text-align:center}
      .card{max-width:390px;padding:32px 26px;border:1px solid #2e2e2e;border-radius:24px;background:#121212;box-shadow:0 24px 70px #0008}.mark{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:#16d968;color:#041108;display:grid;place-items:center;font-size:36px;font-weight:800}
      h1{margin:0 0 10px;font-size:25px}p{margin:0 0 24px;color:#a3a3a3;line-height:1.55}button{width:100%;border:0;border-radius:13px;padding:14px 18px;background:#16d968;color:#041108;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="mark">D</div>
        <h1>Estás sin conexión</h1>
        <p>Comprueba tu conexión a internet para volver a cargar tus demandas, mensajes y trabajos.</p>
        <button type="button" onclick="location.reload()">Volver a intentarlo</button>
      </section>
    </main>
  </body>
</html>
