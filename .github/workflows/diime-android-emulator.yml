name: Android emulator card layout
on:
  pull_request:
    paths:
      - '.github/workflows/diime-android-emulator.yml'
      - 'android/**'
      - 'components/**'
      - 'app/globals.css'
      - 'scripts/*layout.mjs'
      - 'scripts/fixtures/layout-*.mjs'
      - 'scripts/emuladores/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global pnpm@10.34.5 && pnpm install --frozen-lockfile
      - name: Bundle fixtures in the debug APK
        env:
          DIIME_LAYOUT_PLATFORM: android
          DIIME_LAYOUT_FIXTURE_DIR: android/app/src/debug/assets/public/layout
        run: |
          pnpm exec cap sync android
          node scripts/test-profesionales-layout.mjs
          node scripts/test-home-layout.mjs
          jq 'del(.server.url)' android/app/src/main/assets/capacitor.config.json > android/app/src/debug/assets/capacitor.config.json
          install -D -m 644 scripts/emuladores/android/DiimeCardEmulatorTest.java android/app/src/androidTest/java/es/diime/app/DiimeCardEmulatorTest.java
          cd android
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for the Android emulator
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Inspect Diime in a Pixel emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emuladores/android/run.sh
      - name: Preserve emulator measurements and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-card-layout
          path: emulator-evidence/
          if-no-files-found: warn
