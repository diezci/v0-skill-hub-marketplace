<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1512">
  <meta name="robots" content="noindex">
  <title>Sin conexión | Diime</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1512; color: #f4f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
    main { width: 100%; max-width: 440px; text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 750; margin-bottom: 40px; }
    .brand img { width: 38px; height: 38px; border-radius: 11px; }
    .signal { width: 64px; height: 64px; margin: 0 auto 22px; padding: 17px; background: #153a2e; border-radius: 20px; color: #56d6a1; }
    h1 { font-size: clamp(28px, 7vw, 36px); letter-spacing: -.035em; margin: 0 0 14px; line-height: 1.2; }
    p { color: #bcc9c2; line-height: 1.6; margin: 0 auto 12px; font-size: 16px; }
    .detail { font-size: 14px; color: #92a69b; max-width: 340px; }
    button { margin-top: 22px; min-height: 48px; padding: 12px 28px; border: 0; border-radius: 12px; font: inherit; font-weight: 650; background: #56d6a1; color: #08251a; cursor: pointer; }
    button:hover { background: #77e5b7; }
    button:focus-visible { outline: 3px solid white; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/icons/icon-192.png?v=logo-safe-3" alt="" width="38" height="38">Diime</div>
    <div class="signal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 18 18M8.5 16.5a5 5 0 0 1 7 0M6 12.5a9 9 0 0 1 5.5-2M17 11.5l1 1M2.5 8.5A15 15 0 0 1 5 7M9 5.5A15 15 0 0 1 21.5 8.5"/><circle cx="12" cy="20" r=".8" fill="currentColor"/></svg></div>
    <h1>Sin conexión</h1>
    <p>Comprueba tu conexión a Internet y vuelve a intentarlo.</p>
    <p class="detail">Vuelve a conectarte para consultar tus trabajos, mensajes y pagos.</p>
    <button type="button">Volver a intentar</button>
  </main>
  <script>document.querySelector("button").addEventListener("click", function () { window.location.reload() });</script>
</body>
</html>
