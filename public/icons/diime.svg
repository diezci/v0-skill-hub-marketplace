<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Icono de la app. A sangre y con la "D" dentro de la zona segura (el 80%
       central): en Android los iconos "maskable" se recortan en círculo u otras
       formas según el lanzador, y sin ese margen la letra quedaría cortada. -->
  <rect width="512" height="512" fill="#059669"/>
  <text x="256" y="256" fill="#ffffff"
        font-family="Helvetica, Arial, sans-serif" font-size="256" font-weight="700"
        text-anchor="middle" dominant-baseline="central">D</text>
</svg>
